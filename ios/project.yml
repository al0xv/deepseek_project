name: DSRemote
options:
  bundleIdPrefix: com.deepseek
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
targets:
  DSRemote:
    type: application
    platform: iOS
    sources:
      - path: DSRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepseek.dsremote
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
  DSRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DSRemoteTests
    dependencies:
      - target: DSRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepseek.dsremote.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DSRemote.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DSRemote"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
schemes:
  DSRemote:
    build:
      targets:
        DSRemote: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DSRemoteTests
